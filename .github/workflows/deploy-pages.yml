name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/Test-PublicDistribution.ps1'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact site artifact
        shell: pwsh
        run: ./tools/Test-PublicDistribution.ps1 -SkipReleaseAsset
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
