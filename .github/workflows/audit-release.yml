name: audit-launcher-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to audit
        required: true
        default: launcher-v1.0.0

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download launcher archive and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_TAG) { $env:EVENT_TAG } else { $env:INPUT_TAG }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          gh release download $tag --dir release-assets --pattern 'Project-Rebirth-Launcher-*-win-x64.zip*'
      - name: Audit release contents
        shell: pwsh
        run: ./tools/Test-PublicDistribution.ps1

